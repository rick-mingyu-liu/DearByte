# Checks every PR on GitHub's machines, so nobody has to run a contributor's
# code locally just to test it. Read-only token, no secrets, no model calls.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      # --ignore-scripts: a dependency's install script never runs here.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test

  helper:
    name: WeChat helper compiles
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swiftc -O native/wechat-desktop/main.swift -o "$RUNNER_TEMP/wechat-desktop"
